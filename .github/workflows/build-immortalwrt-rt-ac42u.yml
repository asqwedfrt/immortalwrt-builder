name: Build ImmortalWrt 24.10.7 for ASUS RT-AC42U

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: 'ImmortalWrt 版本号'
        required: true
        default: '24.10.7'
      router_profile:
        description: '路由器 Profile'
        type: choice
        required: true
        default: 'asus_rt-ac42u'
        options:
          - asus_rt-ac42u
          - asus_rt-acrh17
      time_domain:
        description: '自定义映射域名'
        required: true
        default: 'time.android.com'
      time_ip:
        description: '自定义映射 IP'
        required: true
        default: '203.107.6.88'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq zstd

      - name: Download ImmortalWrt ImageBuilder
        run: |
          VERSION="${{ inputs.immortalwrt_version }}"
          IB_NAME="immortalwrt-imagebuilder-${VERSION}-ipq40xx-generic.Linux-x86_64"
          IB_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/ipq40xx/generic/${IB_NAME}.tar.zst"
          echo "Downloading ${IB_URL}..."
          wget -q --show-progress "${IB_URL}" -O imagebuilder.tar.zst
          tar --zstd -xf imagebuilder.tar.zst
          mv "${IB_NAME}" imagebuilder

      - name: Download latest luci-app-openclash IPK
        working-directory: imagebuilder
        run: |
          mkdir -p packages
          IPK_URL=$(curl -fsSL "https://api.github.com/repos/vernesong/OpenClash/releases/latest" \
            | jq -r '.assets[] | select(.name | endswith(".ipk")) | .browser_download_url' \
            | head -n 1)
          if [ -z "${IPK_URL}" ]; then
            echo "Failed to find luci-app-openclash .ipk asset"
            exit 1
          fi
          echo "Downloading ${IPK_URL}..."
          wget -q --show-progress -P packages/ "${IPK_URL}"

      - name: Configure custom hostname mapping (uci-defaults)
        working-directory: imagebuilder
        run: |
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-hosts
          #!/bin/sh
          uci add dhcp domain
          uci set dhcp.@domain[-1].name='${{ inputs.time_domain }}'
          uci set dhcp.@domain[-1].ip='${{ inputs.time_ip }}'
          uci commit dhcp
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-hosts

      - name: Build firmware image
        working-directory: imagebuilder
        run: |
          make image PROFILE="${{ inputs.router_profile }}" \
            PACKAGES="-dnsmasq dnsmasq-full bash curl ca-bundle ipset ip-full ruby ruby-yaml ruby-psych ruby-pstore kmod-tun luci-compat kmod-inet-diag unzip kmod-nft-tproxy luci-app-openclash" \
            FILES="files"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.immortalwrt_version }}-${{ inputs.router_profile }}-openclash
          path: |
            imagebuilder/bin/targets/ipq40xx/generic/*.bin
            imagebuilder/bin/targets/ipq40xx/generic/*.trx
            imagebuilder/bin/targets/ipq40xx/generic/*.itb
            imagebuilder/bin/targets/ipq40xx/generic/sha256sums
          if-no-files-found: error
